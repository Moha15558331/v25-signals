name: Decode ATS icons

on:
  push:
    branches: [main]
    paths:
      - 'ats/icons/icons.b64.json'
      - 'ats/scripts/decode-icons.py'
      - '.github/workflows/decode-ats-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-ats-icons
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode ATS PNG icons from the text snapshot
        run: python3 ats/scripts/decode-icons.py

      - name: Commit icons if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ats/icons/*.png
          if git diff --staged --quiet; then
            echo "ats icons unchanged"
          else
            git commit -m "Add generated ATS PWA PNG icons"
            git push
          fi
