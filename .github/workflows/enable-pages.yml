name: Remove V25 app files

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-v25
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete V25 files and this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f SCHEMA.md app.js manifest.json style.css sw.js \
            config/deriv.js data/demo.json data/signals.json \
            icons/apple-touch-icon.png icons/icon-192-maskable.png icons/icon-192.png \
            icons/icon-512-maskable.png icons/icon-512.png icons/icon.svg icons/icons.b64.json \
            scripts/decode-icons.py shared/core.js shared/deriv-account.js \
            vendor/lightweight-charts.js \
            .github/workflows/enable-pages.yml
          rmdir config data icons scripts shared vendor 2>/dev/null || true
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to delete"
          else
            git commit -m "Remove V25 signal app files; keep ATS PWA"
            git push
          fi
