name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-enable
  cancel-in-progress: false

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode PNG icons from the text snapshot
        run: python3 scripts/decode-icons.py

      - name: Commit icons if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          if git diff --staged --quiet; then
            echo "icons unchanged"
          else
            git commit -m "Add generated PWA PNG icons"
            git push
          fi

      - name: Enable Pages from the main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          HDR=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "Current Pages config (if any):"
          curl -sS "${HDR[@]}" "${API}" || true
          echo
          CODE=$(curl -sS -o /tmp/pages-out.json -w "%{http_code}" -X POST "${HDR[@]}" "${API}" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "POST /pages -> ${CODE}"
          cat /tmp/pages-out.json || true
          echo
          if [ "${CODE}" = "409" ] || [ "${CODE}" = "422" ]; then
            CODE=$(curl -sS -o /tmp/pages-out.json -w "%{http_code}" -X PUT "${HDR[@]}" "${API}" \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "PUT /pages -> ${CODE}"
            cat /tmp/pages-out.json || true
            echo
          fi
          echo "Final Pages config:"
          curl -sS -D - "${HDR[@]}" "${API}"
